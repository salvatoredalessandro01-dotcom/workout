<style>
:root{--paper:#F4F3EC;--card:#fff;--olive:#5B6E2F;--olive-d:#3E4D1F;--ink:#1F2016;--muted:#71766A;--line:#E4E6DA;--field:#FBFCF8;--ok:#5B8A3A;--warn:#C6902B;--risk:#C0503C;}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;background:var(--paper);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased;}
body{padding-bottom:calc(64px + env(safe-area-inset-bottom));}
input,select,button{font-family:inherit;}
header{position:sticky;top:0;z-index:20;background:rgba(244,243,236,.93);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);padding:calc(env(safe-area-inset-top) + 12px) 16px 10px;border-bottom:1px solid var(--line);}
.htop{display:flex;align-items:baseline;justify-content:space-between;gap:8px;}
.htop h1{margin:0;font-size:20px;font-weight:800;letter-spacing:-.02em;}
.htop .sub{font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);}
main{padding:10px 12px 16px;}
.eyebrow{font-size:11.5px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--olive-d);margin:2px 2px 8px;}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;margin:9px 0;overflow:hidden;}
.exhead{display:flex;align-items:center;gap:10px;padding:12px 14px 8px;}
.exname{font-size:15.5px;font-weight:700;line-height:1.2;flex:1;}
.dot{width:9px;height:9px;border-radius:50%;flex:none;}
.dot.ok{background:var(--ok);}.dot.cautela{background:var(--warn);}.dot.rischio{background:var(--risk);}
.setline{display:grid;grid-template-columns:26px 1fr auto auto;gap:8px;align-items:center;padding:7px 14px;border-top:1px solid var(--line);}
.setline .si{font-size:12px;font-weight:700;color:var(--muted);}
.setline .rp{font-size:14px;font-weight:600;}
.setline .rc{font-size:12.5px;color:var(--muted);}
.kg{display:flex;align-items:center;gap:4px;background:var(--field);border:1.5px solid var(--line);border-radius:10px;padding:4px 8px;}
.kg.f{border-color:var(--olive);}
.kg input{width:42px;border:0;background:transparent;font-size:16px;font-weight:700;text-align:right;outline:none;color:var(--ink);padding:0;}
.kg .u{font-size:11px;color:var(--muted);font-weight:700;}
.rest-off{font-size:11px;color:var(--muted);}
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;background:rgba(244,243,236,.95);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);}
.tab{flex:1;background:none;border:0;padding:9px 2px 8px;color:var(--muted);font-size:11px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;}
.tab .ic{font-size:19px;line-height:1;}
.tab.active{color:var(--olive-d);}
.daysel{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:10px;}
.dchip{border:1.5px solid var(--line);background:var(--card);border-radius:11px;padding:7px 0 6px;text-align:center;cursor:pointer;}
.dchip .dl{font-size:10px;font-weight:700;color:var(--muted);text-transform:uppercase;}
.dchip .ds{font-size:12px;font-weight:800;color:var(--olive-d);margin-top:2px;}
.dchip.off .ds{color:#C3C6BA;}
.dchip.sel{background:var(--olive);border-color:var(--olive);}
.dchip.sel .dl,.dchip.sel .ds{color:#fff;}
.wk{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;}
.wkrow{display:flex;align-items:center;gap:10px;padding:10px 12px;border-top:1px solid var(--line);}
.wkrow:first-child{border-top:0;}
.wkrow .wd{width:38px;font-weight:800;font-size:13px;color:var(--olive-d);}
.wkrow select{flex:1;border:1.5px solid var(--line);border-radius:9px;padding:7px 8px;font-size:14px;background:#fff;color:var(--ink);}
.sw{width:44px;height:26px;border-radius:14px;background:#D7DACC;border:0;position:relative;flex:none;cursor:pointer;transition:background .15s;}
.sw.on{background:var(--olive);}
.sw i{position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:left .15s;}
.sw.on i{left:21px;}
.btn{border:0;border-radius:11px;font-weight:700;cursor:pointer;}
.btn.p{background:var(--olive);color:#fff;padding:11px 14px;font-size:14px;}
.btn.g{background:#EEF0E6;color:var(--olive-d);padding:9px 12px;font-size:13px;}
.btn.wide{width:100%;margin-top:10px;}
.row{display:flex;gap:8px;align-items:center;}
.sesscard{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin:9px 0;display:flex;align-items:center;gap:10px;cursor:pointer;}
.sesscard .sid{width:30px;height:30px;border-radius:9px;background:var(--olive);color:#fff;font-weight:800;display:flex;align-items:center;justify-content:center;font-size:15px;flex:none;}
.sesscard .st{font-weight:700;font-size:15px;}
.sesscard .sg{font-size:12px;color:var(--muted);margin-top:2px;}
.sesscard .chev{margin-left:auto;color:#B7BBAD;font-size:20px;}
.chips{display:flex;flex-wrap:wrap;gap:7px;margin:6px 0;}
.gchip{border:1.5px solid var(--line);background:#fff;color:var(--olive-d);border-radius:20px;padding:6px 11px;font-size:12.5px;font-weight:600;cursor:pointer;}
.gchip.on{background:var(--olive);border-color:var(--olive);color:#fff;}
.field{width:100%;border:1.5px solid var(--line);border-radius:10px;padding:10px;font-size:16px;background:#fff;color:var(--ink);margin:5px 0;}
.lbl{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin-top:8px;}
.exedit{background:var(--card);border:1px solid var(--line);border-radius:14px;margin:9px 0;padding:11px 12px;}
.exedit .ehd{display:flex;align-items:center;gap:8px;}
.exedit .ehd .nm{font-weight:700;font-size:14.5px;flex:1;}
.iconbtn{background:#EEF0E6;border:0;border-radius:8px;width:30px;height:30px;font-size:15px;color:var(--olive-d);cursor:pointer;}
.setedit{display:grid;grid-template-columns:22px 1fr 1fr 30px;gap:6px;align-items:center;margin-top:7px;}
.setedit input{border:1.5px solid var(--line);border-radius:8px;padding:7px;font-size:15px;text-align:center;background:#fff;color:var(--ink);width:100%;}
.setedit .cap{font-size:12px;font-weight:700;color:var(--muted);}
.mini{font-size:10.5px;color:var(--muted);text-align:center;}
.note{font-size:12px;color:var(--muted);margin-top:5px;line-height:1.35;}
.overlay{position:fixed;inset:0;z-index:50;background:rgba(30,32,22,.4);display:flex;align-items:flex-end;}
.sheet{background:var(--paper);width:100%;max-height:86vh;border-radius:20px 20px 0 0;display:flex;flex-direction:column;padding-bottom:env(safe-area-inset-bottom);}
.sheet .sh-h{padding:14px 16px 8px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--line);}
.sheet .sh-h h3{margin:0;font-size:16px;font-weight:800;flex:1;}
.sheet .sh-b{overflow:auto;padding:10px 14px 16px;}
.pk{display:flex;align-items:center;gap:10px;padding:11px 4px;border-bottom:1px solid var(--line);cursor:pointer;}
.pk .pn{font-weight:600;font-size:14.5px;flex:1;}
.pk .pg{font-size:11px;color:var(--muted);}
.search{width:100%;border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;font-size:16px;background:#fff;margin:8px 0;}
.flagrow{display:flex;gap:7px;margin-bottom:6px;}
.tag{font-size:11px;font-weight:700;padding:4px 9px;border-radius:20px;border:1.5px solid var(--line);color:var(--muted);cursor:pointer;background:#fff;}
.tag.on{background:var(--olive-d);color:#fff;border-color:var(--olive-d);}
.disc{border:0;background:transparent;color:var(--muted);font-size:12px;font-weight:600;padding:2px 14px 11px;cursor:pointer;}
.entry{display:flex;align-items:center;gap:10px;font-size:13px;padding:6px 0;border-top:1px dashed var(--line);}
.entry .dt{color:var(--muted);min-width:50px;font-weight:600;}
.entry .v{font-weight:700;}
.entry .del{margin-left:auto;color:#b24a3a;background:transparent;border:0;font-size:16px;cursor:pointer;padding:0 4px;}
.banner{background:#FBF2DD;border:1px solid #E7D3A1;color:#6a5312;font-size:12.5px;padding:9px 11px;border-radius:11px;margin-bottom:8px;display:none;}
.empty{color:var(--muted);font-size:13px;font-style:italic;padding:14px 2px;}
.rbtn{background:#EEF0E6;border:0;border-radius:9px;color:var(--olive-d);font-size:12.5px;font-weight:700;padding:6px 9px;cursor:pointer;white-space:nowrap;}
.rbtn:active{opacity:.7;}

  S.order.forEach(function(id){var s=S.sessions[id];
    h+='<div class="sesscard" data-act="editsess" data-id="'+id+'"><span class="sid">'+id+'</span><div><div class="st">'+esc(s.title)+'</div><div class="sg">'+esc(s.groups.join(" \u00b7 "))+' \u00b7 '+s.ex.length+' esercizi</div></div><span class="chev">\u203a</span></div>';
  });
  h+='<button class="btn p wide" data-act="newsess">+ Nuova sessione</button>';
  h+='</main>';
  return h;
}

function viewSessEdit(){
  var id=sessEdit,s=S.sessions[id];
  var h='<header><div class="htop"><h1>Sessione '+id+'</h1><span class="sub" data-act="backpiano" style="cursor:pointer">\u2039 Piano</span></div></header><main>';

  h+='<div class="lbl">Gruppi muscolari</div><div class="chips">'+GROUPS.map(function(g){return '<button class="gchip'+(s.groups.indexOf(g)>=0?" on":"")+'" data-act="togglegroup" data-g="'+esc(g)+'">'+esc(g)+'</button>';}).join("")+'</div>';
  h+='<div class="lbl" style="margin-top:12px">Esercizi</div>';

    h+='<div class="exedit"><div class="ehd"><span class="dot '+ex.sh+'"></span><span class="nm">'+esc(ex.n)+'</span>'+
       '<button class="iconbtn" data-act="moveex" data-e="'+ei+'" data-dir="-1">\u2191</button>'+
       '<button class="iconbtn" data-act="moveex" data-e="'+ei+'" data-dir="1">\u2193</button>'+
       '<button class="iconbtn" data-act="delex" data-e="'+ei+'">\u00d7</button></div>';

    ex.sets.forEach(function(st,xi){
      h+='<div class="setedit"><span class="cap">'+(xi+1)+'</span>'+
         '<input data-set data-e="'+ei+'" data-x="'+xi+'" data-f="reps" value="'+esc(st.reps)+'">'+
         '<input inputmode="numeric" data-set data-e="'+ei+'" data-x="'+xi+'" data-f="rest" value="'+esc(String(st.rest))+'">'+
         '<button class="iconbtn" data-act="delset" data-e="'+ei+'" data-x="'+xi+'">\u00d7</button></div>';
    });
    h+='<div class="row" style="margin-top:8px"><button class="btn g" data-act="addset" data-e="'+ei+'">+ set</button></div>';
    h+='</div>';
  });
  h+='<button class="btn p wide" data-act="openpicker">+ Aggiungi esercizio</button>';
  h+='<button class="btn g wide" data-act="delsess" style="margin-top:8px;color:#C0503C">Elimina sessione</button>';
  h+='</main>';

}

function viewEserc(){
  var h='<header><div class="htop"><h1>Esercizi</h1><span class="sub">database</span></div></header><main>';
  h+='<div class="lbl">Nuovo esercizio</div><div class="exedit">'+
     '<input class="field" id="ne_n" placeholder="Nome esercizio">'+
     '<div class="row"><select class="field" id="ne_g">'+GROUPS.map(function(g){return '<option>'+esc(g)+'</option>';}).join("")+'</select>'+
     '<select class="field" id="ne_sh"><option value="ok">Spalla ok</option><option value="cautela">Cautela</option><option value="rischio">Rischio</option></select></div>'+
     '<div class="row"><input class="field" id="ne_s" inputmode="numeric" placeholder="set (es. 3)"><input class="field" id="ne_r" placeholder="rip (es. 10)"><input class="field" id="ne_rest" inputmode="numeric" placeholder="rec (s)"></div>'+
     '<button class="btn p wide" data-act="newexercise">Aggiungi al database</button></div>';
  h+='<div class="lbl" style="margin-top:12px">Sfoglia ('+effDB().length+')</div>';
  h+='<input class="search" id="eq" placeholder="Cerca..." value="'+esc(filt.q)+'">';
  h+='<div class="chips" id="egroups">'+['Tutti'].concat(GROUPS).map(function(g){var v=(g==="Tutti"?null:g);return '<button class="gchip'+(filt.g===v?" on":"")+'" data-act="filtg" data-g="'+esc(g)+'">'+esc(g)+'</button>';}).join("")+'</div>';
  h+='<div class="flagrow">'+[["","Tutte"],["ok","Spalla ok"],["cautela","Cautela"],["rischio","Rischio"]].map(function(f){return '<button class="tag'+(filt.sh===(f[0]||null)?" on":"")+'" data-act="filtsh" data-sh="'+f[0]+'">'+f[1]+'</button>';}).join("")+'</div>';
  h+='<div id="elist">'+eListHTML()+'</div>';
  h+='</main>';
  return h;
}
function eListHTML(){
  var q=filt.q.toLowerCase();
  var list=effDB().filter(function(x){return (!filt.g||x.g===filt.g)&&(!filt.sh||x.sh===filt.sh)&&(!q||x.n.toLowerCase().indexOf(q)>=0);});
  if(!list.length) return '<div class="empty">Nessun esercizio trovato.</div>';
  return list.map(function(x){return '<div class="pk"><span class="dot '+x.sh+'"></span><div style="flex:1"><div class="pn">'+esc(x.n)+'</div><div class="pg">'+esc(x.g)+' \u00b7 '+x.s+'\u00d7'+esc(x.reps)+' \u00b7 '+x.rest+'\u2033'+(x.note?' \u2014 '+esc(x.note):'')+'</div></div></div>';}).join("");
}

function pickerHTML(){
  var q=filt.q.toLowerCase();
  var list=effDB().filter(function(x){return (!filt.g||x.g===filt.g)&&(!filt.sh||x.sh===filt.sh)&&(!q||x.n.toLowerCase().indexOf(q)>=0);});
  var rows=list.length?list.map(function(x){return '<div class="pk" data-act="pickadd" data-id="'+x.id+'"><span class="dot '+x.sh+'"></span><div style="flex:1"><div class="pn">'+esc(x.n)+'</div><div class="pg">'+esc(x.g)+' \u00b7 '+x.s+'\u00d7'+esc(x.reps)+' \u00b7 '+x.rest+'\u2033'+(x.note?' \u2014 '+esc(x.note):'')+'</div></div><span style="color:var(--olive);font-size:22px;font-weight:700">+</span></div>';}).join(""):'<div class="empty">Nessun esercizio.</div>';
  return '<div class="overlay" data-act="pickbg"><div class="sheet" data-stop="1"><div class="sh-h"><h3>Aggiungi a '+picker+'</h3><button class="btn g" data-act="pickclose">Chiudi</button></div><div class="sh-b">'+
    '<input class="search" id="pq" placeholder="Cerca..." value="'+esc(filt.q)+'">'+
    '<div class="chips">'+['Tutti'].concat(GROUPS).map(function(g){var v=(g==="Tutti"?null:g);return '<button class="gchip'+(filt.g===v?" on":"")+'" data-act="filtg" data-g="'+esc(g)+'">'+esc(g)+'</button>';}).join("")+'</div>'+
    '<div class="flagrow">'+[["","Tutte"],["ok","Spalla ok"],["cautela","Cautela"],["rischio","Rischio"]].map(function(f){return '<button class="tag'+(filt.sh===(f[0]||null)?" on":"")+'" data-act="filtsh" data-sh="'+f[0]+'">'+f[1]+'</button>';}).join("")+'</div>'+
    '<div id="plist">'+rows+'</div></div></div></div>';
}

function viewMenu(){
  var h='<header><div class="htop"><h1>Menu</h1><span class="sub">dati & backup</span></div></header><main>';
  h+='<div class="banner" id="banner">Salvataggio automatico non disponibile qui. Aggiungi alla Home (o pubblica online) e usa Backup.</div>';
  h+='<div class="exedit"><div class="lbl" style="margin-top:0">Dati</div>'+
     '<button class="btn p wide" data-act="backup">Esporta backup</button>'+
     '<button class="btn g wide" data-act="restore" style="margin-top:8px">Ripristina da backup</button>'+
     '<button class="btn g wide" data-act="wipeloads" style="margin-top:8px">Azzera solo i carichi</button>'+'<button class="btn g wide" data-act="wipehist" style="margin-top:8px">Azzera storico sessioni</button>'+
     '<button class="btn g wide" data-act="resetpreset" style="margin-top:8px;color:#C0503C">Ripristina scheda originale</button></div>';
  h+='<div class="note" style="padding:6px 4px">Tutti i dati restano sul telefono. Il backup esporta un file che puoi salvare in File/iCloud.</div>';
  h+='</main>';
  return h;
}

function addFromDB(id){var x=effDB().filter(function(e){return e.id===id;})[0];if(!x)return;var sets=[];for(var i=0;i<x.s;i++)sets.push({reps:x.reps,rest:x.rest,load:""});S.sessions[picker].ex.push({n:x.n,sh:x.sh,note:x.note||"",sets:sets});save();}

function todayLabel(){var d=new Date();return ("0"+d.getDate()).slice(-2)+"/"+("0"+(d.getMonth()+1)).slice(-2);}
function logSession(){var sid=S.week[selDay];if(!sid)return;var snap={ts:Date.now(),d:todayLabel(),s:sid,ex:S.sessions[sid].ex.map(function(ex){return {n:ex.n,loads:ex.sets.map(function(st){return st.load||"";})};})};S.log.push(snap);save();toast("Sessione registrata");render();}
function histRows(sid,name){var rows=S.log.filter(function(e){return e.s===sid;}).map(function(e){var m=(e.ex||[]).filter(function(x){return x.n===name;})[0];return m?{ts:e.ts,d:e.d,loads:m.loads}:null;}).filter(Boolean).reverse();if(!rows.length)return '<div class="note" style="padding:0 14px 12px">Nessuna sessione registrata.</div>';return '<div style="padding:0 14px 12px">'+rows.map(function(r){var ld=r.loads.map(function(x){return x!==""?x:"–";}).join(" · ");return '<div class="entry"><span class="dt">'+r.d+'</span><span class="v">'+esc(ld)+' kg</span><button class="del" data-act="dellog" data-ts="'+r.ts+'">×</button></div>';}).join("")+'</div>';}
function wire(){
  var app=document.getElementById("app");
  app.oninput=function(e){
    var t=e.target;
    if(t.hasAttribute("data-load")){var s=t.getAttribute("data-s"),ei=+t.getAttribute("data-e"),xi=+t.getAttribute("data-x");S.sessions[s].ex[ei].sets[xi].load=t.value.trim();t.parentNode.classList.toggle("f",!!t.value.trim());save();}
    else if(t.hasAttribute("data-set")){var ei2=+t.getAttribute("data-e"),xi2=+t.getAttribute("data-x"),f=t.getAttribute("data-f");var v=t.value;if(f==="rest")v=v.replace(/[^0-9]/g,"");S.sessions[sessEdit].ex[ei2].sets[xi2][f]=(f==="rest"?(+v||0):v);save();}
    else if(t.hasAttribute("data-sesstitle")){S.sessions[sessEdit].title=t.value;save();}
    else if(t.id==="eq"){filt.q=t.value;document.getElementById("elist").innerHTML=eListHTML();}
    else if(t.id==="pq"){filt.q=t.value;var pl=document.getElementById("plist");if(pl)pl.innerHTML=plistRows();}
  };
  app.onchange=function(e){var t=e.target;if(t.hasAttribute("data-act")&&t.getAttribute("data-act")==="assignday"){S.week[t.getAttribute("data-d")]=t.value;save();render();}};
  app.onclick=function(e){
    var el=e.target.closest("[data-act]");if(!el)return;var a=el.getAttribute("data-act");
    if(a==="nav"){view=el.getAttribute("data-v");sessEdit=null;picker=null;render();}
    else if(a==="selday"){selDay=el.getAttribute("data-d");openHist={};render();}
    else if(a==="toggleday"){var d=el.getAttribute("data-d");S.week[d]=S.week[d]?null:S.order[0];save();render();}
    else if(a==="editsess"){sessEdit=el.getAttribute("data-id");render();}
    else if(a==="backpiano"){sessEdit=null;render();}
    else if(a==="togglegroup"){var g=el.getAttribute("data-g");var gr=S.sessions[sessEdit].groups;var k=gr.indexOf(g);if(k>=0)gr.splice(k,1);else gr.push(g);save();render();}
    else if(a==="addset"){var ei=+el.getAttribute("data-e");var sets=S.sessions[sessEdit].ex[ei].sets;var last=sets[sets.length-1]||{reps:"10",rest:60};sets.push({reps:last.reps,rest:last.rest,load:""});save();render();}
    else if(a==="delset"){var ei3=+el.getAttribute("data-e"),xi3=+el.getAttribute("data-x");S.sessions[sessEdit].ex[ei3].sets.splice(xi3,1);save();render();}
    else if(a==="delex"){var ei4=+el.getAttribute("data-e");S.sessions[sessEdit].ex.splice(ei4,1);save();render();}
    else if(a==="moveex"){var ei5=+el.getAttribute("data-e"),dir=+el.getAttribute("data-dir");var arr=S.sessions[sessEdit].ex;var ni=ei5+dir;if(ni>=0&&ni<arr.length){var tmp=arr[ei5];arr[ei5]=arr[ni];arr[ni]=tmp;save();render();}}
    else if(a==="openpicker"){picker=sessEdit;filt={g:null,q:"",sh:null};render();}
    else if(a==="pickclose"||a==="pickbg"){if(a==="pickbg"&&e.target.closest("[data-stop]"))return;picker=null;render();}
    else if(a==="pickadd"){addFromDB(el.getAttribute("data-id"));toast("Esercizio aggiunto");render();}
    else if(a==="filtg"){var gg=el.getAttribute("data-g");filt.g=(gg==="Tutti"?null:gg);render();}
    else if(a==="filtsh"){var sh=el.getAttribute("data-sh");filt.sh=sh||null;render();}
    else if(a==="newsess"){var nid=nextId();S.sessions[nid]={title:"Nuova sessione",groups:[],ex:[]};S.order.push(nid);save();sessEdit=nid;render();}
    else if(a==="delsess"){if(confirm("Eliminare la sessione "+sessEdit+"?")){var id=sessEdit;delete S.sessions[id];S.order=S.order.filter(function(x){return x!==id;});for(var k in S.week)if(S.week[k]===id)S.week[k]=null;save();sessEdit=null;render();}}
    else if(a==="newexercise"){var n=document.getElementById("ne_n").value.trim();if(!n){toast("Inserisci il nome");return;}S.customDB=S.customDB||[];S.customDB.push({g:document.getElementById("ne_g").value,n:n,s:(+document.getElementById("ne_s").value||3),reps:(document.getElementById("ne_r").value||"10"),rest:(+document.getElementById("ne_rest").value||60),sh:document.getElementById("ne_sh").value,note:""});save();toast("Esercizio creato");render();}
    else if(a==="timer"){startTimer(+el.getAttribute("data-sec"));}
    else if(a==="logsession"){logSession();}
    else if(a==="togglehist"){var eih=+el.getAttribute("data-e");openHist[eih]=!openHist[eih];render();}
    else if(a==="dellog"){var ts=+el.getAttribute("data-ts");S.log=S.log.filter(function(e){return e.ts!==ts;});save();render();}
    else if(a==="wipehist"){if(confirm("Cancellare tutto lo storico registrato?")){S.log=[];save();render();toast("Storico cancellato");}}
    else if(a==="backup"){doBackup();}
    else if(a==="restore"){document.getElementById("file").click();}
    else if(a==="wipeloads"){if(confirm("Azzerare tutti i carichi inseriti?")){for(var si in S.sessions)S.sessions[si].ex.forEach(function(ex){ex.sets.forEach(function(st){st.load="";});});save();render();toast("Carichi azzerati");}}
    else if(a==="resetpreset"){if(confirm("Ripristinare la scheda originale? Le modifiche andranno perse.")){S=defaultState();save();sessEdit=null;view="oggi";render();toast("Scheda ripristinata");}}
  };
  document.getElementById("tabbar").onclick=app.onclick;
  if(!hasLS){var b=document.getElementById("banner");if(b)b.style.display="block";}
}
function plistRows(){var q=filt.q.toLowerCase();var list=effDB().filter(function(x){return (!filt.g||x.g===filt.g)&&(!filt.sh||x.sh===filt.sh)&&(!q||x.n.toLowerCase().indexOf(q)>=0);});return list.length?list.map(function(x){return '<div class="pk" data-act="pickadd" data-id="'+x.id+'"><span class="dot '+x.sh+'"></span><div style="flex:1"><div class="pn">'+esc(x.n)+'</div><div class="pg">'+esc(x.g)+' \u00b7 '+x.s+'\u00d7'+esc(x.reps)+' \u00b7 '+x.rest+'\u2033</div></div><span style="color:var(--olive);font-size:22px;font-weight:700">+</span></div>';}).join(""):'<div class="empty">Nessun esercizio.</div>';}
function nextId(){var used=S.order.slice();var abc="ABCDEFGHIJKLMNOPQRSTUVWXYZ";for(var i=0;i<abc.length;i++)if(used.indexOf(abc[i])<0)return abc[i];return "S"+(S.order.length+1);}
function doBackup(){var blob=new Blob([JSON.stringify(S,null,2)],{type:"application/json"});var url=URL.createObjectURL(blob);var a=document.createElement("a");a.href=url;a.download="scheda-completa.json";document.body.appendChild(a);a.click();setTimeout(function(){URL.revokeObjectURL(url);a.remove();},400);toast("Backup esportato");}
tbEl().onclick=function(e){var b=e.target.closest('[data-t]');if(!b)return;var t=b.getAttribute('data-t');if(t==='add'){if(timer.paused)timer.rem+=15;else timer.end+=15000;timer.done=false;if(!timer.iv)timer.iv=setInterval(tick,200);drawTimer();}else if(t==='pause'){if(timer.paused){timer.paused=false;timer.end=Date.now()+timer.rem*1000;}else{timer.paused=true;timer.rem=remaining();}drawTimer();}else if(t==='stop'){stopTimer();}};
document.addEventListener('visibilitychange',function(){if(document.visibilityState==='visible'&&timer.iv&&!timer.paused){reqWake();drawTimer();}});
document.getElementById("file").onchange=function(ev){var f=ev.target.files[0];if(!f)return;var r=new FileReader();r.onload=function(){try{var d=JSON.parse(r.result);if(d.sessions&&d.order&&d.week){S=d;save();render();toast("Dati ripristinati");}else toast("File non valido");}catch(e){toast("File non valido");}};r.readAsText(f);ev.target.value="";};
render();
</script></body></html>
